[project]
name = "planka-cli"
version = "4.7.1"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "rich",
    "pyyaml",
    "jq",
]

[project.scripts]
planka = "planka.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/planka"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
# Explicit set (ignores any user-level ruff config): pyflakes, errors, isort;
# minus style the codebase uses on purpose:
# E741 short `l` loop vars, E702 one-line argparse wiring with `;`.
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E741", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
